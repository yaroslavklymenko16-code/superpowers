<html><head><link rel="stylesheet" href="style.css"><style>
.canvas { width:1280px; height:720px; }
h1 { font-size:132px; }
</style></head><body><div class="canvas">
<div class="glow" style="width:520px;height:520px;background:#3d8bff;left:-160px;top:-180px"></div>
<div class="glow" style="width:480px;height:480px;background:#ff5fa8;right:-140px;bottom:-200px"></div>
<div style="position:absolute;left:70px;top:78px;width:600px;display:flex;flex-direction:column;gap:26px">
  <div class="blocks"><i style="background:var(--b)"></i><i style="background:var(--r)"></i><i style="background:var(--y)"></i><i style="background:var(--g)"></i><i style="background:var(--o)"></i></div>
  <h1>Creator<span>Quest</span></h1>
  <p class="sub" style="font-size:42px;line-height:1.1">Kids build Roblox games<br>with AI</p>
  <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:6px">
    <span class="chip" style="font-size:24px"><b>8</b> games</span>
    <span class="chip" style="font-size:24px"><b>21</b> quests</span>
    <span class="chip" style="font-size:24px"><b>118</b> 3D models</span>
  </div>
</div>
<div class="screen" style="width:640px;left:700px;top:120px;transform:rotate(3deg)"><img src="pc-1920-path.png" style="width:1000px;margin-left:-190px;margin-top:-30px"></div>
<div class="badge" style="font-size:30px;padding:10px 20px;left:640px;top:70px;transform:rotate(-6deg)">Ages 9–14</div>
<div class="badge ai" style="font-size:26px;padding:10px 18px;right:46px;top:560px;transform:rotate(4deg)">You describe it.<br>AI builds it.</div>
<img class="sticker" src="Dragon.png" style="width:230px;left:560px;top:430px">
<img class="sticker" src="Rocket.png" style="width:200px;right:-20px;top:-10px">
<img class="sticker" src="Kitty.png" style="width:150px;left:860px;top:520px">
<img class="sticker" src="Treasure_Chest.png" style="width:150px;left:455px;top:22px;transform:rotate(-8deg)">
</div></body></html>
