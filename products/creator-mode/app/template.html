<title>Creator Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Game UI: night "baseplate" grid, chunky toy-brick buttons. Single dark look on purpose. */
  :root {
    --bg: #13213a; --bg-2: #0e1a2f; --panel: #1d3157; --panel-2: #24406f; --edge: #0a1324;
    --fg: #f3f7ff; --muted: #a9b9d6; --grid: rgba(255,255,255,0.045);
    --blue: #3d8bff; --red: #ff4f4f; --yellow: #ffd23f; --green: #36d67a; --orange: #ff8a2b; --pink: #ff5fa8; --purple: #b46bff;
    --ink: #0b1528;
    --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg-2); }
  h1, h2, h3, .display { font-family: var(--display); font-weight: 700; line-height: 1.08; margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); }
  h2 { font-size: clamp(1.6rem, 4vw, 2.2rem); }
  h3 { font-size: 1.25rem; }
  p { margin: 0; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  main.wrap { padding-block: 24px 64px; }

  /* Chunky buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    font: 700 1.05rem var(--display); letter-spacing: .01em; padding: 12px 20px; border-radius: 12px;
    border: 3px solid var(--ink); background: var(--blue); color: #fff; box-shadow: 0 5px 0 var(--ink);
    transition: transform .08s, box-shadow .08s, filter .15s; text-decoration: none;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .btn:focus-visible, .chip:focus-visible, .opt:focus-visible, .codeline:focus-visible, .node:focus-visible, input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  .btn.yellow { background: var(--yellow); color: var(--ink); }
  .btn.green { background: var(--green); color: var(--ink); }
  .btn.ghost { background: var(--panel-2); }
  .btn.small { font-size: .9rem; padding: 7px 12px; border-radius: 10px; box-shadow: 0 3px 0 var(--ink); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }

  .panel { background: var(--panel); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 6px 0 var(--ink); padding: 18px; }
  .label { font: 700 .75rem/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .muted { color: var(--muted); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

  /* HUD */
  header.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg-2); border-bottom: 3px solid var(--ink); }
  .hud .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
  .me { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar { width: 40px; height: 40px; border-radius: 10px; border: 3px solid var(--ink); position: relative; flex: none; box-shadow: 0 3px 0 var(--ink); }
  .avatar::before, .avatar::after { content: ""; position: absolute; top: 12px; width: 6px; height: 8px; background: var(--ink); border-radius: 2px; }
  .avatar::before { left: 9px; } .avatar::after { right: 9px; }
  .me-name { font: 700 1.05rem var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 14ch; }
  .me-rank { font-size: .8rem; color: var(--yellow); font-family: var(--display); font-weight: 600; }
  .xp { flex: 1 1 180px; min-width: 160px; display: flex; align-items: center; gap: 10px; }
  .lvl { font: 700 .95rem var(--display); background: var(--yellow); color: var(--ink); border: 3px solid var(--ink); border-radius: 10px; padding: 2px 8px; white-space: nowrap; }
  .bar { flex: 1; height: 18px; background: var(--edge); border: 3px solid var(--ink); border-radius: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--green), var(--green) 10px, #2cc06c 10px, #2cc06c 20px); transition: width .6s cubic-bezier(.2,.9,.3,1.2); }
  .xpnum { font: 600 .85rem var(--mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  nav.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { cursor: pointer; font: 700 .9rem var(--display); padding: 7px 12px; border-radius: 10px; border: 3px solid var(--ink); background: var(--panel); box-shadow: 0 3px 0 var(--ink); }
  .chip[aria-current="page"], .chip[aria-pressed="true"] { background: var(--yellow); color: var(--ink); }

  /* Welcome */
  .welcome { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; align-items: center; padding-block: 24px; }
  .welcome > * { min-width: 0; }
  .title-blocks { display: flex; gap: 6px; margin-bottom: 14px; }
  .title-blocks span { width: 26px; height: 26px; border: 3px solid var(--ink); border-radius: 6px; box-shadow: 0 3px 0 var(--ink); }
  .welcome h1 span { color: var(--yellow); }
  input[type="text"] { width: 100%; font: 700 1.2rem var(--display); padding: 12px 14px; border-radius: 12px; border: 3px solid var(--ink); background: var(--bg-2); color: var(--fg); }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { width: 44px; height: 44px; border-radius: 10px; border: 3px solid var(--ink); cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
  .swatch[aria-pressed="true"] { outline: 3px solid #fff; outline-offset: 2px; }
  .copilot-note { border: 3px dashed var(--yellow); border-radius: 14px; padding: 14px; font-size: .95rem; }

  /* Map */
  .map { position: relative; display: grid; grid-template-columns: 1fr 1fr; column-gap: 60px; row-gap: 14px; grid-auto-rows: minmax(52px, auto); margin-top: 20px; }
  .map::before { content: ""; position: absolute; left: 50%; top: 30px; bottom: 30px; border-left: 6px dotted rgba(255,255,255,.18); transform: translateX(-3px); }
  .node { position: relative; grid-row: var(--r) / span 2; cursor: pointer; text-align: left; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center;
    background: var(--panel); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 6px 0 var(--ink); padding: 14px; transition: transform .12s; }
  .node:hover { transform: translateY(-3px); }
  .node:nth-child(odd) { grid-column: 1; }
  .node:nth-child(even) { grid-column: 2; }
  .node .num { width: 58px; height: 58px; border-radius: 14px; border: 3px solid var(--ink); display: grid; place-items: center; font: 700 1.8rem var(--display); color: var(--ink); box-shadow: 0 4px 0 var(--ink); }
  .node .meta { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .node .tag { font-size: .9rem; color: var(--muted); }
  .node.locked { filter: grayscale(.85) brightness(.7); cursor: not-allowed; }
  .node.locked:hover { transform: none; }
  .status { display: inline-flex; align-items: center; gap: 6px; font: 700 .75rem var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 8px; border: 2px solid var(--ink); width: fit-content; }
  .status.done { background: var(--green); color: var(--ink); }
  .status.play { background: var(--yellow); color: var(--ink); }
  .status.lock { background: var(--edge); color: var(--muted); }
  .stars { color: var(--yellow); letter-spacing: 2px; font-size: .85rem; }
  .stars .off { color: rgba(255,255,255,.2); }

  /* Mission */
  .mhead { border-radius: 18px; border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); padding: 22px; color: var(--ink); display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end; }
  .mhead > * { min-width: 0; }
  .mhead .label { color: rgba(11,21,40,.7); }
  .mhead p { max-width: 60ch; font-size: 1.05rem; margin-top: 10px; }
  .builds { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .builds li { background: var(--panel-2); border: 3px solid var(--ink); border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: .95rem; }
  .stepper { display: flex; gap: 8px; flex-wrap: wrap; margin: 22px 0 16px; }
  .stepper .chip { display: inline-flex; gap: 8px; align-items: center; }
  .stepper .chip .ok { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--ink); background: var(--edge); }
  .stepper .chip .ok.on { background: var(--green); }
  .lesson { font-size: 1.08rem; max-width: 64ch; }
  .opt { display: block; width: 100%; text-align: left; cursor: pointer; padding: 12px 14px; border-radius: 12px; border: 3px solid var(--ink); background: var(--panel-2); box-shadow: 0 4px 0 var(--ink); font-weight: 700; }
  .opt.right { background: var(--green); color: var(--ink); }
  .opt.wrong { background: var(--red); animation: shake .35s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .explain { font-weight: 700; color: var(--green); }
  .check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; padding: 10px 12px; border-radius: 12px; background: var(--panel-2); border: 3px solid var(--ink); }
  .check input { appearance: none; flex: none; width: 26px; height: 26px; margin: 0; border: 3px solid var(--ink); border-radius: 7px; background: var(--edge); cursor: pointer; display: grid; place-items: center; }
  .check input:checked { background: var(--green); }
  .check input:checked::after { content: ""; width: 8px; height: 13px; border: solid var(--ink); border-width: 0 4px 4px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .check input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .check span { flex: 1; min-width: 0; }
  .prompt-box { position: relative; background: var(--bg-2); border: 3px solid var(--green); border-radius: 14px; padding: 16px; }
  .prompt-box pre { max-height: 280px; overflow-y: auto; margin: 0; white-space: pre-wrap; font: .92rem/1.55 var(--mono); color: #d9ffe9; }
  .code { background: #0a1220; border: 3px solid var(--ink); border-radius: 14px; overflow: auto; max-height: 420px; }
  .code pre { margin: 0; padding: 14px; font: .82rem/1.5 var(--mono); color: #d8e3ff; white-space: pre; }
  details.rescue > summary { cursor: pointer; font: 700 1.05rem var(--display); list-style: none; }
  details.rescue > summary::-webkit-details-marker { display: none; }
  details.rescue > summary::before { content: "+ "; color: var(--yellow); }
  details.rescue[open] > summary::before { content: "– "; }
  .codeline { display: grid; grid-template-columns: 36px 1fr; width: 100%; text-align: left; cursor: pointer; border: 0; background: transparent; padding: 4px 8px; border-radius: 8px; font: .92rem/1.5 var(--mono); color: #d8e3ff; white-space: pre-wrap; }
  .codeline:hover { background: rgba(255,255,255,.07); }
  .codeline .ln { color: #5e7194; user-select: none; }
  .codeline.right { background: rgba(54,214,122,.3); }
  .codeline.wrong { background: rgba(255,79,79,.3); animation: shake .35s; }
  .bugbox { background: #0a1220; border: 3px solid var(--ink); border-radius: 14px; padding: 8px; overflow-x: auto; }
  .power { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .power .panel { display: flex; flex-direction: column; gap: 10px; }
  .power .panel > *:last-child { margin-top: auto; }
  .power code { display: block; font: .85rem/1.5 var(--mono); background: var(--bg-2); padding: 10px; border-radius: 10px; white-space: pre-wrap; color: #d9ffe9; }
  .hold { position: relative; overflow: hidden; }
  .hold .fill { position: absolute; inset: 0; width: 0; background: rgba(255,255,255,.35); pointer-events: none; }
  .slot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .slot div { background: var(--bg-2); border: 3px solid var(--ink); border-radius: 12px; padding: 12px; text-align: center; min-width: 0; }
  .slot b { display: block; font: 700 1.15rem var(--display); color: var(--yellow); margin-top: 4px; overflow-wrap: anywhere; }


  /* Duolingo-style path */
  .path { display: flex; flex-direction: column; align-items: center; gap: 52px; max-width: 600px; margin: 18px auto 0; padding-bottom: 40px; --k: 1; }
  .unit { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--ink); border: 3px solid var(--ink); border-radius: 16px; padding: 14px 18px; box-shadow: 0 6px 0 var(--ink); margin-top: 18px; }
  .unit .label { color: rgba(11,21,40,.7); }
  .unit h3 { margin-top: 4px; }
  .unit-count { font: 700 1rem var(--display); background: rgba(255,255,255,.55); border: 2px solid var(--ink); border-radius: 10px; padding: 3px 10px; white-space: nowrap; }
  .pwrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; transform: translateX(calc(var(--x) * var(--k) * 1px)); }
  .pnode { width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--ink); background: var(--panel-2); box-shadow: 0 8px 0 var(--ink); display: grid; place-items: center; cursor: pointer; transition: transform .08s, box-shadow .08s; padding: 0; }
  .pnode:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ink); }
  .pnode svg { width: 38px; height: 38px; fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .pnode.big { width: 112px; height: 112px; border-radius: 30px; }
  .pnode.big svg { width: 56px; height: 56px; }
  .pnode.done { background: var(--yellow); }
  .pnode.locked { background: #2a3550; cursor: not-allowed; }
  .pnode.locked svg { stroke: #6b7a99; }
  .pnode.current { animation: glow 1.6s ease-in-out infinite; }
  @keyframes glow { 0%,100% { outline: 4px solid rgba(255,210,63,0); outline-offset: 4px; } 50% { outline: 4px solid rgba(255,210,63,.9); outline-offset: 8px; } }
  .pnode:focus-visible { outline: 3px solid var(--yellow); outline-offset: 4px; }
  .plabel { font: 600 .85rem var(--display); color: var(--muted); max-width: 170px; text-align: center; }
  .plabel.big { font-size: 1rem; color: var(--fg); }
  .bubble { position: absolute; top: -40px; font: 700 .85rem var(--display); letter-spacing: .08em; background: #fff; color: var(--ink); border: 3px solid var(--ink); border-radius: 10px; padding: 4px 10px; animation: bob 1.2s ease-in-out infinite; z-index: 2; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 12px; height: 12px; background: #fff; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .pwrap.has-pop { z-index: 6; }
  .pop { position: absolute; top: calc(100% + 8px); z-index: 4; width: min(300px, 86vw); background: var(--panel); border: 3px solid var(--ink); border-top: 8px solid var(--c); border-radius: 16px; box-shadow: 0 6px 0 var(--ink); padding: 14px; display: flex; flex-direction: column; gap: 8px; text-align: left; animation: pop .2s ease-out; }
  .pop .btn { width: 100%; }
  .streak { display: inline-flex; align-items: center; gap: 5px; font: 700 .95rem var(--display); color: var(--muted); white-space: nowrap; }
  .streak i { width: 14px; height: 18px; background: #4a5878; border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%; display: block; }
  .streak.on { color: var(--orange); }
  .streak.on i { background: linear-gradient(var(--yellow), var(--orange)); }
  .streak.big { font-size: 1.1rem; }
  .streak.big i { width: 18px; height: 24px; }
  /* Lesson (skill quest) */
  .lesson-wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .lesson-top { display: flex; align-items: center; gap: 14px; }
  .lesson-top .x { width: 40px; height: 40px; flex: none; border-radius: 10px; border: 3px solid var(--ink); background: var(--panel); color: var(--muted); font: 700 1.1rem var(--display); cursor: pointer; }
  .lbar { flex: 1; height: 20px; }
  .lesson-card { display: flex; flex-direction: column; gap: 18px; }
  .lesson-body { display: flex; flex-direction: column; gap: 14px; }
  .tip { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; background: var(--panel-2); border: 3px solid var(--ink); border-radius: 14px; padding: 12px 14px; font-size: 1.05rem; }
  .tip > * { min-width: 0; }
  .tipnum { width: 30px; height: 30px; border-radius: 8px; border: 3px solid var(--ink); display: grid; place-items: center; font: 700 1rem var(--display); color: var(--ink); }
  .cont { width: 100%; font-size: 1.15rem; padding: 14px; }
  .medal svg { width: 34px; height: 34px; fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }


  /* v4: profiles, steps, figures, rewards */
  button.me { background: none; border: 0; padding: 4px 6px; border-radius: 12px; cursor: pointer; text-align: left; }
  button.me:hover { background: var(--panel); }
  button.me:focus-visible { outline: 3px solid var(--yellow); }
  .chip.is-locked { opacity: .55; }
  .chip.is-locked::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 6px; border: 2px solid currentColor; border-radius: 2px; vertical-align: 0; }
  .profiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; width: 100%; max-width: 760px; margin-top: 10px; }
  .profile { cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 20px 12px; background: var(--panel); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink); transition: transform .1s; }
  .profile:hover { transform: translateY(-3px); }
  .profile:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  .profile b { font: 700 1.2rem var(--display); }
  .profile.add { border-style: dashed; background: transparent; }
  .avatar.big { width: 72px; height: 72px; border-radius: 18px; }
  .avatar.big::before, .avatar.big::after { top: 22px; width: 10px; height: 14px; }
  .avatar.big::before { left: 18px; } .avatar.big::after { right: 18px; }
  .avatar.plus { display: grid; place-items: center; background: var(--panel-2); font: 700 2rem var(--display); }
  .avatar.plus::before, .avatar.plus::after { display: none; }
  .path-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; max-width: 600px; margin: 0 auto; }
  .continue-card { display: flex; align-items: center; gap: 14px; width: 100%; max-width: 600px; margin: 16px auto 0; padding: 14px 16px; cursor: pointer; text-align: left; background: var(--panel); border: 3px solid var(--ink); border-left: 10px solid var(--c, var(--yellow)); border-radius: 16px; box-shadow: 0 6px 0 var(--ink); }
  .continue-card:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  .cc-icon { width: 48px; height: 48px; flex: none; border-radius: 12px; border: 3px solid var(--ink); background: var(--c); display: grid; place-items: center; }
  .cc-icon svg { width: 28px; height: 28px; fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .cc-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .cc-text b { font: 700 1.2rem var(--display); }
  .cc-go { font: 700 1rem var(--display); background: var(--yellow); color: var(--ink); border: 3px solid var(--ink); border-radius: 10px; padding: 6px 12px; white-space: nowrap; }
  .unit.locked { filter: grayscale(.7) brightness(.75); }
  .plabel.dim { opacity: .55; }
  .lesson-count { font: 600 .8rem var(--mono); color: var(--muted); white-space: nowrap; }
  .lesson-foot { display: flex; gap: 10px; align-items: center; }
  .lesson-foot .cont { flex: 1; }
  .lesson-body .mhead { margin-bottom: 4px; }
  .tip.new { animation: pop .3s ease-out; }
  .steps { display: flex; flex-direction: column; gap: 10px; }
  .step { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; padding: 12px; border-radius: 14px; border: 3px solid var(--ink); background: var(--panel-2); }
  .step > * { min-width: 0; }
  .step-dot { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; background: var(--edge); font: 700 1rem var(--display); }
  .step-dot svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .step.done { background: transparent; border-color: rgba(54,214,122,.5); }
  .step.done .step-dot { background: var(--green); color: var(--ink); }
  .step.done p { color: var(--muted); }
  .step.active { border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(255,210,63,.25); }
  .step.active .step-dot { background: var(--yellow); color: var(--ink); }
  .step.locked { opacity: .45; }
  .step.locked .step-dot { color: var(--muted); }
  .step-main { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .step-main p { font-weight: 700; padding-top: 5px; }
